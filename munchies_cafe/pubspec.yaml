name: munchies_cafe
description: "Munchies Café: a Flutter app for a fictional dessert café."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  carousel_slider: ^5.1.2
  cupertino_icons: ^1.0.6
  intl: ^0.19.0
  path_provider: ^2.1.2
  provider: ^6.1.2
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^3.0.0
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Amarante
      fonts:
        - asset: fonts/Amarante-Regular.ttf
    - family: AlumniSans
      fonts:
        - asset: fonts/AlumniSans-Regular.ttf
        - asset: fonts/AlumniSans-Italic.ttf
          style: italic
        - asset: fonts/AlumniSans-Bold.ttf
          weight: 700
